services:
  postgres:
    image: postgres:16
    container_name: finance-controller-postgres
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_controller
    ports:
      - "5432:5432"
    volumes:
      - finance_controller_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_controller"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finance_controller_pgdata:
